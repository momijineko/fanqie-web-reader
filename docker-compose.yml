services:
  fqapi:
    build:
      context: .
      dockerfile: Dockerfile.fqapi
      args:
        FQAPI_REF: ${FQAPI_REF:-v0.2.0}
    image: fanqie-fqapi:local
    container_name: fanqie-fqapi
    mem_limit: 256m
    ports:
      # Loopback only: host-side start.bat / local python can hit FQAPI_API=127.0.0.1:18921
      # after `docker compose up -d fqapi` without exposing the signer on the LAN.
      - "127.0.0.1:18921:18921"
    environment:
      FQ_API_TOKENS: ${FQAPI_TOKEN:?Set FQAPI_TOKEN in .env}
      FQ_MAX_CONCURRENCY: "40"
    volumes:
      - fqapi-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:18921/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 40s
      retries: 3

  fanqie-web-reader:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${APP_VERSION:-0.0.0-dev}
    container_name: fanqie-web-reader
    ports:
      - "8199:8199"
    mem_limit: 512m
    environment:
      - PARA_COMMENT_MOCK=false
      - FQAPI_API=http://fqapi:18921
      - FQAPI_TOKEN=${FQAPI_TOKEN:?Set FQAPI_TOKEN in .env}
      - COMMUNITY_API=${COMMUNITY_API:-http://101.35.133.34:5000,https://tt.sjmyzq.cn}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      # 可选：仍可指向外部 unidbg 作为段评正文兜底
      - UNIDBG_API=${UNIDBG_API:-}
    restart: unless-stopped
    depends_on:
      fqapi:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8199/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

volumes:
  fqapi-data:

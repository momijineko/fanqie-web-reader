name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-vps-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Production deploys only from main tip — never an arbitrary workflow_dispatch ref.
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Resolve main tip SHA
        id: pin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SHA=$(gh api "repos/${{ github.repository }}/commits/main" --jq .sha)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Deploy pin: $SHA"

      - name: Deploy native stack via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          EXPECTED_SHA: ${{ steps.pin.outputs.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 20m
          envs: EXPECTED_SHA
          script: |
            set -euo pipefail
            echo "=== disk / memory ==="
            df -h /
            free -h

            APP_DIR="$HOME/fanqie-web-reader"
            test -d "$APP_DIR/.git"
            test -n "$EXPECTED_SHA"
            test "${#EXPECTED_SHA}" -eq 40

            # Same flock as native-deploy.sh and the VPS timer. Hold it across
            # git fetch, script install, and the deploy child (fd 9 is inherited).
            LOCK_FILE="${FANQIE_DEPLOY_LOCK:-/tmp/fanqie-deploy.lock}"
            exec 9>"$LOCK_FILE"
            if ! flock -w 600 9; then
              echo "REFUSING deploy: could not acquire $LOCK_FILE within 600s"
              exit 1
            fi
            export FANQIE_DEPLOY_LOCK_HELD=1

            export GIT_HTTP_LOW_SPEED_LIMIT=1000
            export GIT_HTTP_LOW_SPEED_TIME=45
            cd "$APP_DIR"

            # Fetch the pin for script extraction only — do NOT reset the live tree
            # here. native-deploy.sh owns reset + restart.
            fetch_pin() {
              local url="$1"
              git remote set-url origin "$url"
              timeout 90 git fetch --depth 1 origin "$EXPECTED_SHA"
            }
            if ! fetch_pin "https://github.com/momijineko/fanqie-web-reader.git"; then
              echo "github.com fetch slow/failed, trying ghproxy for pinned SHA"
              fetch_pin "https://ghproxy.net/https://github.com/momijineko/fanqie-web-reader.git"
            fi
            git remote set-url origin https://github.com/momijineko/fanqie-web-reader.git
            git show "$EXPECTED_SHA:scripts/native-deploy.sh" > /tmp/native-deploy.sh
            install -m 755 /tmp/native-deploy.sh "$HOME/bin/native-deploy.sh"

            EXPECTED_SHA="$EXPECTED_SHA" "$HOME/bin/native-deploy.sh"

            free -h
            echo "Deployment completed successfully!"

name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Queue production deploys; do not cancel one that is already restarting units.
concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Production deploys only from main tip — never an arbitrary workflow_dispatch ref.
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Resolve main tip SHA
        id: pin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Always pin to current main tip (not a selected non-main dispatch ref).
          SHA=$(gh api "repos/${{ github.repository }}/commits/main" --jq .sha)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Deploy pin: $SHA"

      - name: Deploy native stack via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          EXPECTED_SHA: ${{ steps.pin.outputs.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 20m
          envs: EXPECTED_SHA
          script: |
            set -euo pipefail
            echo "=== disk / memory ==="
            df -h /
            free -h

            APP_DIR="$HOME/fanqie-web-reader"
            test -d "$APP_DIR/.git"
            test -n "$EXPECTED_SHA"
            test "${#EXPECTED_SHA}" -eq 40

            export APP_DIR EXPECTED_SHA
            # Same lock file as scripts/native-deploy.sh. Hold it across the
            # reset and the script so a timer tick cannot interleave.
            flock -w 1200 "$HOME/.fanqie-native-deploy.lock" bash -s <<'LOCKED'
            set -euo pipefail
            export GIT_HTTP_LOW_SPEED_LIMIT=1000
            export GIT_HTTP_LOW_SPEED_TIME=45
            cd "$APP_DIR"

            fetch_pin() {
              local url="$1"
              git remote set-url origin "$url"
              timeout 90 git fetch --depth 1 origin "$EXPECTED_SHA"
            }
            if ! fetch_pin "https://github.com/momijineko/fanqie-web-reader.git"; then
              echo "github.com fetch slow/failed, trying ghproxy for pinned SHA"
              fetch_pin "https://ghproxy.net/https://github.com/momijineko/fanqie-web-reader.git"
            fi
            git reset --hard "$EXPECTED_SHA"
            GOT=$(git rev-parse HEAD)
            if [ "$GOT" != "$EXPECTED_SHA" ]; then
              echo "REFUSING deploy: HEAD $GOT != expected $EXPECTED_SHA"
              exit 1
            fi
            git remote set-url origin https://github.com/momijineko/fanqie-web-reader.git
            install -m 755 scripts/native-deploy.sh "$HOME/bin/native-deploy.sh"

            # Caller holds the lock; the script must not flock again.
            FANQIE_DEPLOY_LOCK_HELD=1 EXPECTED_SHA="$EXPECTED_SHA" "$HOME/bin/native-deploy.sh"
            LOCKED

            free -h
            echo "Deployment completed successfully!"

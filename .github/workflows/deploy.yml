name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Deploy to VPS via SSH
      uses: appleboy/ssh-action@v1.0.3
      env:
        FQAPI_TOKEN: ${{ secrets.FQAPI_TOKEN }}
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USERNAME }}
        key: ${{ secrets.VPS_SSH_KEY }}
        port: ${{ secrets.VPS_PORT || 22 }}
        command_timeout: 30m
        envs: FQAPI_TOKEN
        script: |
            echo "=== Initial disk ==="
            df -h /
            echo "=== Initial memory ==="
            free -h

            docker compose -f /projects/fanqie-web-reader/docker-compose.yml down --remove-orphans 2>/dev/null || true
            # Stop legacy unidbg if still running from older deploys
            if [ -f /opt/unidbg/unidbg.pid ]; then
              OLD_PID=$(cat /opt/unidbg/unidbg.pid)
              kill "$OLD_PID" 2>/dev/null || true
              rm -f /opt/unidbg/unidbg.pid
            fi
            rm -rf /tmp/unidbg_* /tmp/hsperfdata_* 2>/dev/null || true
            docker system prune -af 2>/dev/null || true
            apt-get clean 2>/dev/null || true

            if ! swapon --show | grep -q /swapfile; then
              if [ ! -f /swapfile ]; then
                echo "Creating 1GB swap..."
                dd if=/dev/zero of=/swapfile bs=1M count=1024
                chmod 600 /swapfile
                mkswap /swapfile
              fi
              swapon /swapfile
            fi

            echo "=== After cleanup ==="
            df -h /
            free -h

            cd /projects/fanqie-web-reader
            git fetch origin main
            git reset --hard origin/main
            echo "Current commit: $(git rev-parse --short HEAD)"

            # Persist / inject FQAPI_TOKEN into .env (required by compose)
            TOKEN_FILE=/opt/fqapi/token
            mkdir -p /opt/fqapi
            if [ -n "${FQAPI_TOKEN:-}" ]; then
              umask 077
              printf '%s' "$FQAPI_TOKEN" > "$TOKEN_FILE"
            elif [ -s "$TOKEN_FILE" ]; then
              FQAPI_TOKEN=$(cat "$TOKEN_FILE")
            else
              umask 077
              FQAPI_TOKEN=$(openssl rand -hex 32)
              printf '%s' "$FQAPI_TOKEN" > "$TOKEN_FILE"
            fi
            chmod 600 "$TOKEN_FILE"
            export FQAPI_TOKEN
            if [ -f .env ]; then
              if grep -q '^FQAPI_TOKEN=' .env; then
                sed -i "s|^FQAPI_TOKEN=.*|FQAPI_TOKEN=${FQAPI_TOKEN}|" .env
              else
                printf '\nFQAPI_TOKEN=%s\n' "$FQAPI_TOKEN" >> .env
              fi
            else
              cp .env.example .env
              sed -i "s|^FQAPI_TOKEN=.*|FQAPI_TOKEN=${FQAPI_TOKEN}|" .env
            fi

            export APP_VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "0.0.0-dev")
            echo "APP_VERSION=$APP_VERSION"

            echo "Building fqapi + web reader (first fqapi build may take several minutes)..."
            docker compose build
            docker compose up -d

            echo "Waiting for fqapi readiness..."
            for i in $(seq 1 40); do
              CODE=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 3 http://127.0.0.1:18921/readyz 2>/dev/null || echo 000)
              # fqapi is loopback-only inside container; probe via docker exec
              if docker exec fanqie-fqapi curl -fsS http://127.0.0.1:18921/readyz >/dev/null 2>&1; then
                echo "fqapi READY"
                break
              fi
              echo "fqapi check $i ..."
              sleep 3
            done

            sleep 5
            echo "=== Final ==="
            docker compose ps
            curl -s -o /dev/null -w "Web reader HTTP %{http_code}\n" http://127.0.0.1:8199/api/health || echo "Web reader not ready"
            docker exec fanqie-fqapi curl -fsS http://127.0.0.1:18921/healthz || echo "fqapi healthz failed"
            free -h
            df -h /
            docker image prune -f
            echo "Deployment completed successfully!"

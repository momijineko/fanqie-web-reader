name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy native stack via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          EXPECTED_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 20m
          envs: EXPECTED_SHA
          script: |
            set -euo pipefail
            echo "=== disk / memory ==="
            df -h /
            free -h

            APP_DIR="$HOME/fanqie-web-reader"
            test -d "$APP_DIR/.git"
            test -x "$HOME/bin/native-deploy.sh"

            # Keep server copy of native-deploy.sh in sync with the pinned commit
            # by running the in-tree script after a verified github.com fetch.
            export GIT_HTTP_LOW_SPEED_LIMIT=1000
            export GIT_HTTP_LOW_SPEED_TIME=30
            cd "$APP_DIR"
            git remote set-url origin https://github.com/momijineko/fanqie-web-reader.git
            git fetch --depth 1 origin "$EXPECTED_SHA"
            git fetch --tags --force origin
            git fetch --deepen=200 origin main || true
            git reset --hard "$EXPECTED_SHA"
            GOT=$(git rev-parse HEAD)
            if [ "$GOT" != "$EXPECTED_SHA" ]; then
              echo "REFUSING deploy: HEAD $GOT != expected $EXPECTED_SHA"
              exit 1
            fi
            install -m 755 scripts/native-deploy.sh "$HOME/bin/native-deploy.sh"

            # Re-run full deploy with the same pin (idempotent install/restart)
            EXPECTED_SHA="$EXPECTED_SHA" "$HOME/bin/native-deploy.sh"

            systemctl --user --no-pager is-active fanqie-fqapi.service fanqie-web.service
            free -h
            echo "Deployment completed successfully!"

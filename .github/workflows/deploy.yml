name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy native stack via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 20m
          script: |
            set -euo pipefail
            echo "=== disk / memory ==="
            df -h /
            free -h

            APP_DIR="$HOME/fanqie-web-reader"
            test -d "$APP_DIR/.git"
            cd "$APP_DIR"

            # Prefer CN mirror for git pull from Beijing VPS; fall back to GitHub.
            git remote set-url origin https://kkgithub.com/momijineko/fanqie-web-reader.git || true
            if ! git fetch --depth 1 origin main; then
              echo "kkgithub fetch failed, trying github.com"
              git remote set-url origin https://github.com/momijineko/fanqie-web-reader.git
              git fetch --depth 1 origin main
            fi
            git reset --hard origin/main
            echo "Deploy commit: $(git rev-parse --short HEAD)"

            # Keep existing .env (FQAPI_TOKEN / CORS). Only fill missing keys from example.
            if [ ! -f .env ]; then
              cp .env.example .env
            fi
            if ! grep -q '^FQAPI_API=' .env; then
              echo 'FQAPI_API=http://127.0.0.1:18921' >> .env
            fi
            if ! grep -q '^CORS_ORIGINS=' .env; then
              echo 'CORS_ORIGINS=https://fanqie.momijineko.cn,http://127.0.0.1:8199' >> .env
            fi

            if [ ! -x .venv/bin/python ]; then
              python3.11 -m venv .venv
            fi
            # shellcheck disable=SC1091
            . .venv/bin/activate
            python -m pip install -q -U pip -i https://pypi.tuna.tsinghua.edu.cn/simple --trusted-host pypi.tuna.tsinghua.edu.cn
            python -m pip install -q -r requirements.txt -i https://pypi.tuna.tsinghua.edu.cn/simple --trusted-host pypi.tuna.tsinghua.edu.cn

            systemctl --user daemon-reload
            systemctl --user restart fanqie-fqapi.service || true
            systemctl --user restart fanqie-web.service

            echo "Waiting for fqapi /readyz ..."
            FQAPI_READY=0
            for i in $(seq 1 40); do
              if curl -fsS --noproxy '*' --connect-timeout 3 http://127.0.0.1:18921/readyz >/dev/null 2>&1; then
                echo "fqapi READY"
                FQAPI_READY=1
                break
              fi
              echo "fqapi check $i ..."
              sleep 3
            done
            if [ "$FQAPI_READY" != "1" ]; then
              echo "!!! fqapi never became ready !!!"
              systemctl --user --no-pager -l status fanqie-fqapi.service || true
              journalctl --user -u fanqie-fqapi.service -n 50 --no-pager || true
              exit 1
            fi

            sleep 2
            WEB_CODE=$(curl -s --noproxy '*' -o /dev/null -w "%{http_code}" --connect-timeout 5 http://127.0.0.1:8199/api/health || echo 000)
            echo "Web reader HTTP $WEB_CODE"
            if [ "$WEB_CODE" != "200" ]; then
              echo "!!! web reader health check failed !!!"
              systemctl --user --no-pager -l status fanqie-web.service || true
              journalctl --user -u fanqie-web.service -n 50 --no-pager || true
              exit 1
            fi

            systemctl --user --no-pager is-active fanqie-fqapi.service fanqie-web.service
            free -h
            echo "Deployment completed successfully!"

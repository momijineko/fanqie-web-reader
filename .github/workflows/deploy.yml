name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy native stack via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          EXPECTED_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 20m
          envs: EXPECTED_SHA
          script: |
            set -euo pipefail
            echo "=== disk / memory ==="
            df -h /
            free -h

            APP_DIR="$HOME/fanqie-web-reader"
            test -d "$APP_DIR/.git"

            # Bootstrap / refresh deploy script from the pinned commit using the
            # same trust model as native-deploy.sh (SHA from Actions = trusted).
            export GIT_HTTP_LOW_SPEED_LIMIT=1000
            export GIT_HTTP_LOW_SPEED_TIME=45
            cd "$APP_DIR"

            fetch_pin() {
              local url="$1"
              git remote set-url origin "$url"
              timeout 90 git fetch --depth 1 origin "$EXPECTED_SHA"
            }
            if ! fetch_pin "https://github.com/momijineko/fanqie-web-reader.git"; then
              echo "github.com fetch slow/failed, trying ghproxy for pinned SHA"
              fetch_pin "https://ghproxy.net/https://github.com/momijineko/fanqie-web-reader.git"
            fi
            git reset --hard "$EXPECTED_SHA"
            GOT=$(git rev-parse HEAD)
            if [ "$GOT" != "$EXPECTED_SHA" ]; then
              echo "REFUSING deploy: HEAD $GOT != expected $EXPECTED_SHA"
              exit 1
            fi
            git remote set-url origin https://github.com/momijineko/fanqie-web-reader.git
            install -m 755 scripts/native-deploy.sh "$HOME/bin/native-deploy.sh"

            EXPECTED_SHA="$EXPECTED_SHA" "$HOME/bin/native-deploy.sh"

            systemctl --user --no-pager is-active fanqie-fqapi.service fanqie-web.service
            free -h
            echo "Deployment completed successfully!"
